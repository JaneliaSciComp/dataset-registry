name: Outdated dependencies

# Two independent jobs, both scheduled monthly:
#
# - upgrade: runs `uv lock --upgrade`, which only ever moves versions within
#   the bounds declared in pyproject.toml, and opens/updates a pull request
#   with whatever moved. Force-pushes the same branch each run rather than
#   piling up duplicates, so there is always at most one open PR from this job.
# - report: lists releases that exist but fall *outside* those bounds -- e.g.
#   a dependency capped at `<3` with a 3.x release available -- so a major
#   upgrade is a visible, deliberate decision (widen the bound by hand, then
#   let the next `upgrade` run pick it up) instead of something found out
#   about years later. This job only reports; it never changes anything.

on:
  schedule:
    # 07:00 UTC on the first of each month
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Upgrade within declared bounds
        run: uv lock --upgrade

      - name: Open or update the upgrade pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already up to date within current bounds."
            exit 0
          fi

          BRANCH="deps/auto-upgrade"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add uv.lock
          git commit -m "build(deps): upgrade within declared bounds"
          git push --force origin "$BRANCH"

          TITLE="Upgrade dependencies within declared bounds"
          BODY="Ran \`uv lock --upgrade\`. Only moves versions within the \
          bounds already declared in \`pyproject.toml\` -- review the \`uv.lock\` \
          diff and merge if the test matrix passes."

          EXISTING=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
          else
            gh pr create --title "$TITLE" --body "$BODY" --head "$BRANCH" --base main
          fi

  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Reports only releases that the bounds in pyproject.toml forbid, so this
      # never repeats what the `upgrade` job above already covers.
      - name: Check for bound-blocked releases
        id: check
        run: |
          uv run --with packaging --no-project \
            .github/scripts/report_outdated.py > outdated.txt
          if [ -s outdated.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          cat outdated.txt

      - name: Open or update the tracking issue
        if: steps.check.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Dependency releases blocked by version bounds"
          {
            echo "These direct dependencies have newer releases that the version"
            echo "bounds in \`pyproject.toml\` currently forbid:"
            echo
            cat outdated.txt
            echo
            echo "The \`upgrade\` job in this same workflow cannot offer these,"
            echo "because they fall outside the declared constraints. Taking one"
            echo "means widening the bound in \`pyproject.toml\` by hand, running"
            echo "\`just upgrade\`, and making whatever code changes the new"
            echo "version requires."
            echo
            echo "Anything **not** listed here that has an update available is"
            echo "already covered by the next scheduled \`upgrade\` run."
            echo
            echo "_Updated by the \`outdated\` workflow; close it if these bounds are deliberate._"
          } > body.md

          EXISTING=$(gh issue list --state all --search "$TITLE in:title" --json number,state --jq '.[0]')
          NUMBER=$(echo "$EXISTING" | jq -r '.number // empty')
          if [ -n "$NUMBER" ]; then
            if [ "$(echo "$EXISTING" | jq -r '.state')" = "CLOSED" ]; then
              gh issue reopen "$NUMBER"
            fi
            gh issue edit "$NUMBER" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
