name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }} ${{ matrix.resolution }}
    runs-on: ${{ matrix.platform }}
    env:
      # disable resyncing on uv run
      UV_NO_SYNC: "1"
      # runners have no Janelia network access or pre-populated share cache
      JANELIA_PATHLIB_NO_FETCH: "1"
    strategy:
      fail-fast: false
      # OS-specific bugs are almost always OS/driver related and Python-version-
      # agnostic, while version-specific bugs are language/stdlib related and OS-
      # agnostic -- the two axes rarely interact, so we don't need their full cross:
      #   - lowest-direct (oldest allowed deps) on all platforms, but only at our
      #     floor Python version -- those dependency versions predate newer Pythons
      #     anyway, so testing them there too is redundant.
      #   - highest deps on all platforms, but only at our newest supported Python.
      #   - any Python version in between only on ubuntu (cheapest runner), as a
      #     spot-check rather than a full platform cross.
      matrix:
        include:
          - platform: ubuntu-latest
            python-version: "3.11"
            resolution: lowest-direct
          - platform: macos-latest
            python-version: "3.11"
            resolution: lowest-direct
          - platform: windows-latest
            python-version: "3.11"
            resolution: lowest-direct
          - platform: ubuntu-latest
            python-version: "3.12"
            resolution: highest
          - platform: ubuntu-latest
            python-version: "3.13"
            resolution: highest
          - platform: ubuntu-latest
            python-version: "3.14"
            resolution: highest
          - platform: macos-latest
            python-version: "3.14"
            resolution: highest
          - platform: windows-latest
            python-version: "3.14"
            resolution: highest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # setuptools-scm needs tags to determine the version

      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-dev --group test --resolution ${{ matrix.resolution }}

      - name: Test
        run: uv run pytest --color=yes --cov --cov-report=xml --cov-report=term-missing

      # Coverage works out of the box for public repos. Private repos need a
      # CODECOV_TOKEN repository secret.
      - name: Coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  deploy:
    name: Create release
    needs: [test]
    if: success() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # for creating the GitHub release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b') }}
